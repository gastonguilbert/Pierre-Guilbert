<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pierre Guilbert · Œuvres</title>
<meta name="description" content="Vitrine des œuvres de Pierre Guilbert : peintures, dessins, sculptures et photographies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e02a1a;--vermillon:#f04e1e;--gold:#f0b224;--yellow:#f2e21c;
  --cyan:#1eb6de;--blue:#1f5fd0;--green:#2fb84e;--magenta:#d81f5e;
  --ink:#0f0c12;--panel:#1c1620;--paper:#f4efe6;--muted:#8a8194;--line:#2a2330;
  --edge:clamp(18px,4vw,64px);--gap:clamp(8px,1.3vw,18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ============ BARRE HAUTE (persistante) ============ */
.topbar{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--edge);background:linear-gradient(to bottom,rgba(15,12,18,.9),transparent);pointer-events:none}
.topbar .brand{font-family:"Archivo Black",sans-serif;text-transform:uppercase;font-size:clamp(.95rem,1.8vw,1.25rem);
  letter-spacing:-.01em;pointer-events:auto;cursor:pointer;color:var(--paper);text-decoration:none;line-height:1}
.topbar .brand span{color:var(--yellow)}
.topbar .modes{display:flex;gap:6px;pointer-events:auto;background:rgba(28,22,32,.6);padding:5px;border-radius:2px}
.topbar .modes button{appearance:none;border:none;background:none;cursor:pointer;color:var(--muted);
  font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  font-size:.82rem;padding:9px 18px;transition:.2s;border-radius:2px}
.topbar .modes button:hover{color:var(--paper);background:rgba(244,239,230,.08)}
.topbar .modes button.active{color:var(--ink);background:var(--yellow)}

/* ============ MODE GALERIE (accueil) — carrousel automatique ============ */
#galerie{display:block}
#galerie.hidden{display:none}
/* le hero reste en ouverture, defilable ; la galerie carrousel vient apres */
.g-scroll{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.g-scroll::-webkit-scrollbar{width:0}
.hero{scroll-snap-align:start}

/* la scene du carrousel occupe un plein ecran, apres le hero */
.g-carousel{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;overflow:hidden}
.g-track{position:relative;width:100%;height:76vh;display:flex;align-items:center;justify-content:center}
/* chaque oeuvre est positionnee en absolu ; on anime left/scale/opacite/flou */
.g-slide{position:absolute;top:50%;left:50%;transition:transform .9s cubic-bezier(.25,.46,.45,.94),
  opacity .9s ease,filter .9s ease;display:flex;flex-direction:column;align-items:center;will-change:transform,opacity,filter}
.g-slide img{max-height:70vh;width:auto;max-width:60vw;display:block;box-shadow:0 40px 100px rgba(0,0,0,.6)}
/* position centrale : nette, grande */
.g-slide.center{transform:translate(-50%,-50%) scale(1);opacity:1;filter:none;z-index:5}
/* voisines : plus petites, floues, sur les cotes */
.g-slide.prev{transform:translate(calc(-50% - 40vw),-50%) scale(.62);opacity:.4;filter:blur(5px);z-index:3}
.g-slide.next{transform:translate(calc(-50% + 40vw),-50%) scale(.62);opacity:.4;filter:blur(5px);z-index:3}
/* hors champ : invisibles */
.g-slide.hidden-slide{opacity:0;transform:translate(-50%,-50%) scale(.4);pointer-events:none;z-index:1}
.g-slide.off-left{transform:translate(calc(-50% - 80vw),-50%) scale(.5);opacity:0;z-index:0}
.g-slide.off-right{transform:translate(calc(-50% + 80vw),-50%) scale(.5);opacity:0;z-index:0}
/* cartel de l'oeuvre centrale */
.g-cartel{margin-top:22px;text-align:center;font-family:"Archivo Narrow",sans-serif;letter-spacing:.06em;
  min-height:3.2em;z-index:6}
.g-cartel .yr{font-family:"Archivo Black",sans-serif;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--paper)}
.g-cartel .tech{color:var(--muted);font-size:.8rem;margin-top:3px;text-transform:uppercase;letter-spacing:.12em}
/* barre de progression du timer */
.g-timer{position:fixed;bottom:0;left:0;height:4px;background:var(--yellow);width:0;z-index:56;
  transition:width .1s linear}
/* mention discrete "exposition en cours" */
.g-caption-mode{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:55;
  font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;letter-spacing:.16em;
  font-size:.72rem;color:var(--muted)}
@media(max-width:820px){
  .g-slide img{max-width:82vw;max-height:56vh}
  .g-slide.prev{transform:translate(calc(-50% - 44vw),-50%) scale(.5)}
  .g-slide.next{transform:translate(calc(-50% + 44vw),-50%) scale(.5)}
}

/* ============ MODE VUE D'ENSEMBLE (sous-pages grille) ============ */
#ensemble{display:none;padding-top:60px}
#ensemble.active{display:block}
.e-hero{padding:clamp(30px,6vw,70px) var(--edge) clamp(16px,3vw,30px);position:relative;overflow:hidden;border-bottom:2px solid var(--line)}
.e-hero h1{font-family:"Archivo Black",sans-serif;font-size:clamp(2.2rem,7vw,5rem);text-transform:uppercase;line-height:.9;letter-spacing:-.02em}
.e-hero h1 span{color:var(--yellow)}
nav.tabs{position:sticky;top:52px;z-index:40;background:var(--panel);border-bottom:2px solid var(--line)}
.tabs-inner{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{appearance:none;border:none;background:none;cursor:pointer;font-family:"Archivo Narrow",sans-serif;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;font-size:clamp(.82rem,1.4vw,1rem);color:var(--muted);
  padding:clamp(14px,2vw,18px) clamp(16px,2.4vw,30px);white-space:nowrap;transition:.2s;border-right:1px solid var(--line)}
.tab .count{font-size:.66em;vertical-align:super;margin-left:.3em;opacity:.6}
.tab:hover{color:var(--paper)}
.tab.active{color:var(--ink)}
.tab[data-slug="peintures"].active{background:var(--red);color:#fff}
.tab[data-slug="dessins"].active{background:var(--yellow);color:var(--ink)}
.tab[data-slug="sculptures"].active{background:var(--cyan);color:var(--ink)}
.tab[data-slug="photographies"].active{background:var(--green);color:var(--ink)}
.tab[data-slug="autres"].active{background:var(--magenta);color:#fff}
/* controles de tri */
.sortbar{display:flex;align-items:center;gap:10px;padding:16px var(--edge) 0;flex-wrap:wrap}
.sortbar .lbl{font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--muted)}
.sortbar button{appearance:none;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);
  font-family:"Archivo Narrow",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  font-size:.78rem;padding:7px 14px;transition:.2s}
.sortbar button:hover{color:var(--paper);border-color:var(--muted)}
.sortbar button.active{background:var(--paper);color:var(--ink);border-color:var(--paper)}
main.e-main{padding:clamp(20px,3vw,40px) var(--edge) 12vh}
.section-note{color:var(--muted);font-size:.9rem;margin-bottom:clamp(18px,3vw,30px);min-height:1.2em;font-family:"Archivo Narrow",sans-serif;letter-spacing:.03em}
.grid{display:block}
@media(max-width:640px){.year-works{grid-template-columns:repeat(2,1fr)}}
.cell{break-inside:avoid;margin-bottom:var(--gap);cursor:zoom-in;position:relative;background:var(--panel);overflow:hidden;
  opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.cell.in{opacity:1;transform:none}
.cell img{display:block;width:100%;height:auto;transition:transform .55s cubic-bezier(.2,0,.1,1)}
.cell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 0 var(--yellow);transition:box-shadow .2s;pointer-events:none}
.cell:hover img{transform:scale(1.04)}
.cell:hover::after{box-shadow:inset 0 0 0 4px var(--yellow)}
.cell .meta{position:absolute;left:0;bottom:0;background:var(--yellow);color:var(--ink);font-family:"Archivo Narrow",sans-serif;
  font-weight:700;font-size:.8rem;padding:3px 10px;transform:translateY(100%);transition:transform .25s ease;font-variant-numeric:tabular-nums}
.cell:hover .meta{transform:none}
.series-badge{position:absolute;top:0;right:0;background:var(--cyan);color:var(--ink);font-family:"Archivo Narrow",sans-serif;
  font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.64rem;padding:3px 8px;z-index:2}

/* ============ LIGHTBOX (partagée) ============ */
.lb{position:fixed;inset:0;z-index:100;background:rgba(15,12,18,.97);display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.lb.open{opacity:1;visibility:visible}
.lb-stage{max-width:90vw;max-height:80vh;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:90vw;max-height:80vh;width:auto;height:auto;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.lb-stage img.ready{opacity:1}
.lb-caption{position:fixed;bottom:clamp(16px,4vh,38px);left:0;right:0;text-align:center;font-family:"Archivo Narrow",sans-serif;
  font-weight:600;letter-spacing:.04em;color:var(--paper);font-variant-numeric:tabular-nums}
.lb-caption .idx{color:var(--muted);margin-left:.7em}
.lb-series{position:fixed;bottom:0;left:0;right:0;z-index:105;display:flex;gap:12px;justify-content:center;align-items:flex-end;
  padding:12px clamp(14px,3vw,30px) calc(clamp(16px,4vh,38px) + 22px);
  background:linear-gradient(to top,rgba(15,12,18,.9),transparent);flex-wrap:wrap;pointer-events:none}
.lb-series.show{pointer-events:auto}.lb-series:empty{display:none}
.lb-series figure{margin:0;cursor:pointer;text-align:center;transition:transform .2s}
.lb-series figure:hover{transform:translateY(-4px)}
.lb-series img{height:clamp(58px,9vh,96px);width:auto;display:block;border:2px solid rgba(244,239,230,.25);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.lb-series figure.active img{border-color:var(--yellow)}
.lb-series figcaption{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.62rem;color:var(--muted);margin-top:5px}
.lb-series figure.active figcaption{color:var(--yellow)}
.lb.has-series .lb-caption{bottom:calc(clamp(58px,9vh,96px) + 46px)}
.lb-btn{position:fixed;top:0;bottom:0;width:clamp(60px,12vw,150px);border:none;background:none;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:color .2s;z-index:101}
.lb-btn:hover{color:var(--yellow)}.lb-btn svg{width:28px;height:28px}
.lb-prev{left:0;justify-content:flex-start;padding-left:clamp(14px,3vw,38px)}
.lb-next{right:0;justify-content:flex-end;padding-right:clamp(14px,3vw,38px);top:90px}
.lb-close{position:fixed;top:clamp(12px,3vh,26px);right:clamp(14px,3vw,30px);width:52px;height:52px;border:none;
  background:var(--red);cursor:pointer;color:#fff;z-index:110;display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;border-radius:50%}
.lb-close:hover{background:var(--vermillon);transform:rotate(90deg)}.lb-close svg{width:22px;height:22px}
@media(max-width:640px){.lb-btn{width:52px}.lb-stage,.lb-stage img{max-height:72vh}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.cell{opacity:1;transform:none}.g-work{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ============ HERO ANIMÉ (ouverture galerie) ============ */
/* ---------- HERO : composition geometrique ---------- */
.hero{
  position:relative;
  min-height:88vh;
  padding:var(--edge);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  border-bottom:6px solid var(--yellow);
}
/* formes geometriques animees en SVG (morph de chemins) */
.hero-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;transform-origin:70% 30%;will-change:transform,opacity}
.hero-bg path{will-change:d,transform}
.hero-grain{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 30% 90%,transparent 30%,rgba(20,16,24,.7) 100%);
  mix-blend-mode:multiply}
.hero-inner{position:relative;z-index:2;max-width:15ch}
.hero-inner::before{content:"";position:absolute;z-index:-1;
  left:-6vw;right:-8vw;top:-4vh;bottom:-6vh;
  background:radial-gradient(ellipse at 30% 55%,rgba(20,16,24,.82) 40%,transparent 78%)}
.eyebrow{
  font-family:"Archivo Narrow",sans-serif;
  font-weight:700;
  letter-spacing:.32em;
  text-transform:uppercase;
  font-size:clamp(.68rem,1.1vw,.82rem);
  color:var(--yellow);
  margin-bottom:1.2rem;
}
.title{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(3.4rem,13vw,11rem);
  line-height:.82;
  letter-spacing:-.02em;
  text-transform:uppercase;
  color:var(--paper);
}
.title .l2{color:var(--yellow)}
.lede{
  margin-top:1.6rem;
  max-width:34ch;
  font-size:clamp(1rem,1.5vw,1.15rem);
  line-height:1.5;
  color:rgba(244,239,230,.82);
}

/* le hero ouvre la galerie, puis les oeuvres defilent ensuite */
.hero{scroll-snap-align:start}
.hero .scroll-cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;
  color:var(--yellow);font-family:"Archivo Narrow",sans-serif;text-transform:uppercase;letter-spacing:.14em;
  font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:8px;animation:cueBounce 2s ease-in-out infinite}
.hero .scroll-cue svg{width:22px;height:22px}
@keyframes cueBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(6px)}}

/* ============ CHRONOLOGIE PAR ANNÉE (vue d'ensemble) ============ */
.year-row{margin-bottom:clamp(30px,5vw,64px)}
.year-line{display:flex;align-items:center;gap:20px;margin-bottom:clamp(16px,2.5vw,28px)}
.year-line .yr{font-family:"Archivo Black",sans-serif;font-size:clamp(1.8rem,4.5vw,3.4rem);
  color:var(--yellow);line-height:1;white-space:nowrap;letter-spacing:-.01em}
.year-line .rule{flex:1;height:2px;background:linear-gradient(to right,var(--yellow),var(--line))}
.year-line .cnt{font-family:"Archivo Narrow",sans-serif;color:var(--muted);font-size:.8rem;
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.year-works{display:flex;flex-wrap:wrap;gap:var(--gap);align-items:flex-end}
.year-works .cell{opacity:1;transform:none;height:clamp(180px,26vh,300px);flex:0 0 auto}
.year-works .cell img{height:100%;width:auto;max-width:none}
@media(max-width:640px){.year-works .cell{height:150px}}

</style>
</head>
<body>

<div class="topbar">
  <a class="brand" id="brandHome">Pierre <span>Guilbert</span></a>
  <div class="modes">
    <button id="modeGal" class="active">Galerie</button>
    <button id="modeEns">Vue d'ensemble</button>
  </div>
</div>

<!-- ============ MODE GALERIE ============ -->
<section id="galerie">
  <div class="g-scroll" id="gscroll">
<section class="hero">
  <svg id="heroSvg" class="hero-bg" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

        <stop offset="0" stop-color="#f0b224"/><stop offset="1" stop-color="#2fb84e"/>

    </defs>

    <!-- Grande forme rouge : blob rond -> goutte -> cœur -> ovale -> blob, morph continu -->

      <animate attributeName="d" dur="26s" repeatCount="indefinite" calcMode="spline"

    </path>

    <!-- Forme cyan (bas) : arche -> cercle -> vague, 4 courbes constantes -->
    <path fill="url(#gCyan)" d="M600,760 C600,660 600,560 600,560 C700,540 820,540 920,560 C920,560 920,660 920,760 C820,760 700,760 600,760 Z">
      <animate attributeName="d" dur="22s" repeatCount="indefinite" calcMode="spline"

          M600,760 C600,650 665,540 760,540 C855,540 920,650 920,760 C920,760 860,720 760,720 C660,720 600,760 600,760 Z;
          M600,760 C620,690 600,600 640,560 C720,530 800,590 920,560 C920,640 900,720 860,760 C760,730 680,790 600,760 Z;

    </path>

    <!-- Cercle magenta -> triangle -> cercle : 3 courbes constantes, morph doux -->
    <path fill="#d81f5e" d="M492,368 C532,368 564,400 564,440 C564,480 532,512 492,512 C452,512 420,480 420,440 C420,400 452,368 492,368 Z">
      <animate attributeName="d" dur="19s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33;0.66;1"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
        values="

      <animateTransform attributeName="transform" type="translate" dur="28s" repeatCount="indefinite"

          M480,300 C490,228 528,180 588,192 C566,232 566,262 588,300 C552,306 516,306 480,300 Z;
          M480,300 C475,235 525,196 588,192 C580,230 580,264 588,300 C552,298 516,302 480,300 Z;
          M480,300 C480,240 528,192 588,192 C588,228 588,264 588,300 C552,300 516,300 480,300 Z"/>

  <div class="hero-grain" aria-hidden="true"></div>
  <div class="hero-inner">
    <p class="eyebrow">Peintures · Dessins · Sculptures · Photographies</p>
    <h1 class="title"><span class="l1">Pierre</span><br><span class="l2">Guilbert</span></h1>
  </div>
  <div class="scroll-cue">Découvrir les œuvres
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>

</section>

  <div class="g-carousel" id="gcarousel">
    <div class="g-track" id="gtrack"></div>
    <div class="g-cartel" id="gcartel"></div>
  </div>

</div>
  <div class="g-timer" id="gtimer"></div>
  <div class="g-caption-mode">Exposition en cours · déambulation automatique</div>
</section>

<!-- ============ MODE VUE D'ENSEMBLE ============ -->
<section id="ensemble">
  <div class="e-hero"><h1>Les <span>œuvres</span></h1></div>
  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
  <div class="sortbar" id="sortbar">
    <span class="lbl">Trier</span>
    <button data-sort="year" class="active">Par année</button>
    <button data-sort="year_desc">Année ↓</button>
  </div>
  <main class="e-main">
    <p class="section-note" id="secNote"></p>
    <div class="grid" id="grid"></div>
  </main>
</section>

<!-- ============ LIGHTBOX ============ -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Œuvre agrandie">
  <button class="lb-close" id="lbClose" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Précédente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Suivante"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="lb-caption" id="lbCap"></div>
  <div class="lb-series" id="lbSeries"></div>
</div>

<script>
const ORDER=["peintures","dessins","sculptures","photographies","autres"];
const NOTES={peintures:"Huiles et acryliques · 1960–1999",dessins:"Crayon, feutre et études · 1944–1994",
  sculptures:"Pierre, plâtre et terre",photographies:"Tirages argentiques et couleur",autres:"Pièces diverses"};
let DATA={},current=null,cur=[],curIdx=0,featured=[],info={};

fetch("manifest.json").then(r=>r.json()).then(m=>{
  DATA=m;featured=m._featured||[];
  for(const slug in m){if(slug[0]==="_")continue;m[slug].items.forEach(it=>info[it.id]={...it,slug})}
  buildGalerie();
  setupCarouselObserver();
  buildTabs();
  select(ORDER.find(s=>DATA[s]&&DATA[s].items&&DATA[s].items.length));
});

/* ---------- MODE GALERIE ---------- */
/* ---------- MODE GALERIE : carrousel automatique ---------- */
let allWorks=[],gIdx=0,gTimer=null,gRAF=null,gStart=0;
const G_DURATION=6000;  // 6 secondes par oeuvre

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildGalerie(){
  // toutes les oeuvres, tous supports, en aleatoire
  allWorks=[];
  for(const slug in DATA){
    if(slug[0]==="_"||!DATA[slug].items)continue;
    DATA[slug].items.forEach(it=>allWorks.push({...it,slug}));
  }
  shuffle(allWorks);
  gIdx=0;
  const track=document.getElementById("gtrack");track.innerHTML="";
  // on cree 5 slots reutilisables (prev, center, next, off-left, off-right)
  // mais plus simple : on cree un slide par oeuvre, positionne dynamiquement (leger car <img loading lazy>)
  allWorks.forEach((it,i)=>{
    const s=document.createElement("div");s.className="g-slide hidden-slide";s.dataset.i=i;
    s.innerHTML=`<img alt="Œuvre${it.year?' de '+it.year:''}" onclick="openLbGrid('${it.id}')">`;
    track.appendChild(s);
  });
  positionSlides();
}

function positionSlides(){
  const slides=document.querySelectorAll("#gtrack .g-slide");
  const n=allWorks.length;
  slides.forEach((s,i)=>{
    const img=s.querySelector("img");
    let cls="g-slide ";
    const diff=(i-gIdx+n)%n;
    if(diff===0){cls+="center";ensureSrc(img,allWorks[i]);}
    else if(diff===1){cls+="next";ensureSrc(img,allWorks[i]);}
    else if(diff===n-1){cls+="prev";ensureSrc(img,allWorks[i]);}
    else if(diff===2){cls+="off-right";}
    else if(diff===n-2){cls+="off-left";}
    else cls+="hidden-slide";
    s.className=cls;
  });
  // cartel
  const it=allWorks[gIdx];
  const cartel=document.getElementById("gcartel");
  const label=DATA[it.slug]?DATA[it.slug].label.replace(/s$/,""):"";
  cartel.innerHTML=`<div class="yr">${it.year||label}</div><div class="tech">Pierre Guilbert${it.year?" · "+label:""}</div>`;
}
function ensureSrc(img,it){
  const want=`images/full/${it.id}.jpg`;
  if(img.getAttribute("src")!==want)img.src=want;
}

function gAdvance(){gIdx=(gIdx+1)%allWorks.length;positionSlides();}

function startCarousel(){
  stopCarousel();
  gStart=performance.now();
  const timerBar=document.getElementById("gtimer");
  function tick(now){
    const elapsed=now-gStart;
    const pct=Math.min(elapsed/G_DURATION,1);
    timerBar.style.width=(pct*100)+"%";
    if(pct>=1){gAdvance();gStart=performance.now();}
    gRAF=requestAnimationFrame(tick);
  }
  gRAF=requestAnimationFrame(tick);
}
function stopCarousel(){
  if(gRAF){cancelAnimationFrame(gRAF);gRAF=null;}
  const t=document.getElementById("gtimer");if(t)t.style.width="0";
}

/* le carrousel tourne seulement quand la scene carrousel est visible ET qu'on est en mode galerie */
function setupCarouselObserver(){
  const carousel=document.getElementById("gcarousel");
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting && !document.getElementById("galerie").classList.contains("hidden")){
        startCarousel();
      }else{
        stopCarousel();
      }
    });
  },{threshold:.6});
  io.observe(carousel);
}

/* ---------- BASCULE DES MODES ---------- */
function goGalerie(){
  document.getElementById("galerie").classList.remove("hidden");
  document.getElementById("ensemble").classList.remove("active");
  document.getElementById("modeGal").classList.add("active");
  document.getElementById("modeEns").classList.remove("active");
  document.getElementById("gtimer").style.display="";
  document.querySelector(".g-caption-mode").style.display="";
  // relancer si la scene carrousel est a l'ecran
  const c=document.getElementById("gcarousel").getBoundingClientRect();
  if(c.top<window.innerHeight*.5&&c.bottom>window.innerHeight*.5)startCarousel();
}
function goEnsemble(){
  document.getElementById("galerie").classList.add("hidden");
  document.getElementById("ensemble").classList.add("active");
  document.getElementById("modeGal").classList.remove("active");
  document.getElementById("modeEns").classList.add("active");
  stopCarousel();
  document.getElementById("gtimer").style.display="none";
  document.querySelector(".g-caption-mode").style.display="none";
  window.scrollTo(0,0);
}
document.getElementById("modeGal").onclick=goGalerie;
document.getElementById("modeEns").onclick=goEnsemble;
document.getElementById("brandHome").onclick=()=>{goGalerie();document.getElementById("gscroll").scrollTo({top:0,behavior:"smooth"})};

/* ---------- MODE VUE D'ENSEMBLE ---------- */
function buildTabs(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  ORDER.forEach(slug=>{
    if(!DATA[slug]||!DATA[slug].items||!DATA[slug].items.length)return;
    const b=document.createElement("button");b.className="tab";b.dataset.slug=slug;
    b.innerHTML=`${DATA[slug].label}<span class="count">${DATA[slug].items.length}</span>`;
    b.onclick=()=>select(slug);
    tabs.appendChild(b);
  });
}
let sortMode="year";
document.querySelectorAll("#sortbar button").forEach(b=>{
  b.onclick=()=>{sortMode=b.dataset.sort;
    document.querySelectorAll("#sortbar button").forEach(x=>x.classList.toggle("active",x===b));
    renderGrid();};
});
const io2=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io2.unobserve(e.target)}})},{rootMargin:"140px"});
function select(slug){
  if(!slug)return;current=slug;
  cur=DATA[slug].items.slice();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.slug===slug));
  document.getElementById("secNote").textContent=NOTES[slug]||"";
  renderGrid();
}
function renderGrid(){
  // tri
  cur.sort((a,b)=>{
    const ha=a.year?0:1,hb=b.year?0:1;      // sans-date toujours en fin
    if(ha!==hb)return ha-hb;
    const ya=a.year||0,yb=b.year||0;
    if(sortMode==="year")return ya-yb||a.src_name.localeCompare(b.src_name);
    if(sortMode==="year_desc")return yb-ya||a.src_name.localeCompare(b.src_name);
    return 0;
  });
  const grid=document.getElementById("grid");grid.innerHTML="";

  // regrouper par annee en conservant l'index global dans cur (pour la lightbox)
  const rows=[];let currentYear="__init__",row=null;
  cur.forEach((it,idx)=>{
    const y=it.year||0;
    if(y!==currentYear){
      currentYear=y;
      row={year:y,items:[]};rows.push(row);
    }
    row.items.push({it,idx});
  });

  rows.forEach(r=>{
    const block=document.createElement("div");block.className="year-row";
    const label=r.year>0?r.year:"Sans date";
    const head=document.createElement("div");head.className="year-line";
    head.innerHTML=`<span class="yr">${label}</span><span class="rule"></span><span class="cnt">${r.items.length} œuvre${r.items.length>1?"s":""}</span>`;
    block.appendChild(head);
    const works=document.createElement("div");works.className="year-works";
    r.items.forEach(({it,idx})=>{
      const cell=document.createElement("figure");cell.className="cell in";
      const img=document.createElement("img");img.loading="lazy";img.decoding="async";
      img.src=`images/thumbs/${it.id}.jpg`;img.alt=it.year?`Œuvre de ${it.year}`:"Œuvre";
      cell.appendChild(img);
      if(it.year){const meta=document.createElement("figcaption");meta.className="meta";meta.textContent=it.year;cell.appendChild(meta);}
      if(it.series){const n=(it.series.sketches?it.series.sketches.length:0)+(it.series.variants?it.series.variants.length:0);
        if(n>0){const badge=document.createElement("span");badge.className="series-badge";badge.textContent=n+(n>1?" études":" étude");cell.appendChild(badge);}}
      cell.onclick=()=>openLb(idx);
      works.appendChild(cell);
    });
    block.appendChild(works);
    grid.appendChild(block);
  });
}

/* ---------- LIGHTBOX ---------- */
const lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg"),lbCap=document.getElementById("lbCap"),lbSeries=document.getElementById("lbSeries");
let seriesViews=[],seriesActive=0,lbFromGrid=true;
function openLb(i){lbFromGrid=true;curIdxLb=i;const it=cur[i];buildSeries(it);seriesActive=0;renderSeriesBar();showSeriesImage(it);lb.classList.add("open");document.body.style.overflow="hidden"}
let curIdxLb=0;
function openLbGrid(id){ // depuis la galerie : ouvre l'oeuvre principale avec sa serie
  const it=info[id];lbFromGrid=false;buildSeries(it);seriesActive=0;renderSeriesBar();showSeriesImage(it);
  lb.classList.add("open");document.body.style.overflow="hidden";
}
function lbFromGalerie(id,role,year){ // clic direct sur une annexe dans la galerie
  lbFromGrid=false;seriesViews=[{id:id,role:role,year:year}];seriesActive=0;renderSeriesBar();
  showSeriesImage({id:id,year:year});lb.classList.add("open");document.body.style.overflow="hidden";
}
function closeLb(){lb.classList.remove("open");document.body.style.overflow=""}
function buildSeries(it){
  seriesViews=[{id:it.id,role:"Œuvre",year:it.year}];
  if(it.series){
    (it.series.variants||[]).forEach(s=>seriesViews.push({id:s.id,role:"Variante",year:s.year}));
    (it.series.sketches||[]).forEach(s=>seriesViews.push({id:s.id,role:"Esquisse",year:s.year}));
  }
}
function renderSeriesBar(){
  lbSeries.innerHTML="";
  if(seriesViews.length<=1){lb.classList.remove("has-series");lbSeries.classList.remove("show");return;}
  lb.classList.add("has-series");lbSeries.classList.add("show");
  seriesViews.forEach((v,i)=>{
    const fig=document.createElement("figure");if(i===seriesActive)fig.className="active";
    fig.innerHTML=`<img src="images/thumbs/${v.id}.jpg" alt="${v.role}"><figcaption>${v.role}</figcaption>`;
    fig.onclick=e=>{e.stopPropagation();seriesActive=i;showSeriesImage();};
    lbSeries.appendChild(fig);
  });
}
function showSeriesImage(){
  const v=seriesViews[seriesActive];lbImg.classList.remove("ready");
  const pre=new Image();pre.onload=()=>{lbImg.src=pre.src;lbImg.classList.add("ready")};
  pre.src=`images/full/${v.id}.jpg`;
  lbImg.alt=v.year?`${v.role} — ${v.year}`:v.role;
  let cap;
  if(seriesViews.length>1)cap=`${v.role}${v.year?" · "+v.year:""}`;
  else cap=v.year||(current?DATA[current].label.replace(/s$/,""):"");
  const idxTxt=(lbFromGrid&&current)?`<span class="idx">${curIdxLb+1} / ${cur.length}</span>`:"";
  lbCap.innerHTML=`${cap}${idxTxt}`;
  lbSeries.querySelectorAll("figure").forEach((f,i)=>f.classList.toggle("active",i===seriesActive));
}
function navLb(d){if(!lbFromGrid)return;curIdxLb=(curIdxLb+d+cur.length)%cur.length;const it=cur[curIdxLb];buildSeries(it);seriesActive=0;renderSeriesBar();showSeriesImage();}
document.getElementById("lbNext").onclick=()=>navLb(1);
document.getElementById("lbPrev").onclick=()=>navLb(-1);
document.getElementById("lbClose").onclick=closeLb;
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("lb-stage"))closeLb()};
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")closeLb();else if(e.key==="ArrowRight")navLb(1);else if(e.key==="ArrowLeft")navLb(-1);
});
/* ---- parallaxe : les formes du hero derivent au scroll de la galerie ---- */
(function(){
  const svg=document.getElementById("heroSvg");
  const sc=document.getElementById("gscroll");
  if(!svg||!sc)return;
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  let ticking=false;
  function update(){
    const y=sc.scrollTop;
    svg.style.transform=`translate3d(${y*0.04}px, ${y*0.28}px, 0) scale(${1+y*0.00016})`;
    svg.style.opacity=Math.max(0,1-y/700);
    ticking=false;
  }
  sc.addEventListener("scroll",()=>{if(!ticking){requestAnimationFrame(update);ticking=true;}},{passive:true});
  update();
})();
</script>
