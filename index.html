<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pierre Guilbert · Œuvres</title>
<meta name="description" content="Vitrine des œuvres de Pierre Guilbert : peintures, dessins, sculptures et photographies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* palette tiree des oeuvres */
  --red:#e02a1a;
  --vermillon:#f04e1e;
  --gold:#f0b224;
  --yellow:#f2e21c;
  --cyan:#1eb6de;
  --blue:#1f5fd0;
  --green:#2fb84e;
  --magenta:#d81f5e;
  --ink:#141018;
  --panel:#1c1620;
  --paper:#f4efe6;
  --muted:#8a8194;
  --edge:clamp(18px,4vw,64px);
  --gap:clamp(8px,1.3vw,18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Archivo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- HERO : composition geometrique ---------- */
.hero{
  position:relative;
  min-height:88vh;
  padding:var(--edge);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  border-bottom:6px solid var(--yellow);
}
/* formes geometriques animees en SVG (morph de chemins) */
.hero-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;transform-origin:70% 30%;will-change:transform,opacity}
.hero-bg path{will-change:d,transform}
.hero-grain{position:absolute;inset:0;z-index:1;
  background:radial-gradient(ellipse at 30% 90%,transparent 30%,rgba(20,16,24,.7) 100%);
  mix-blend-mode:multiply}
.hero-inner{position:relative;z-index:2;max-width:15ch}
.hero-inner::before{content:"";position:absolute;z-index:-1;
  left:-6vw;right:-8vw;top:-4vh;bottom:-6vh;
  background:radial-gradient(ellipse at 30% 55%,rgba(20,16,24,.82) 40%,transparent 78%)}
.eyebrow{
  font-family:"Archivo Narrow",sans-serif;
  font-weight:700;
  letter-spacing:.32em;
  text-transform:uppercase;
  font-size:clamp(.68rem,1.1vw,.82rem);
  color:var(--yellow);
  margin-bottom:1.2rem;
}
.title{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(3.4rem,13vw,11rem);
  line-height:.82;
  letter-spacing:-.02em;
  text-transform:uppercase;
  color:var(--paper);
}
.title .l2{color:var(--yellow)}
.lede{
  margin-top:1.6rem;
  max-width:34ch;
  font-size:clamp(1rem,1.5vw,1.15rem);
  line-height:1.5;
  color:rgba(244,239,230,.82);
}

/* ---------- NAV ---------- */
nav{
  position:sticky;top:0;z-index:30;
  background:var(--panel);
  border-bottom:2px solid rgba(244,239,230,.1);
}
.nav-inner{
  display:flex;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.tab{
  appearance:none;border:none;background:none;cursor:pointer;
  font-family:"Archivo Narrow",sans-serif;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-size:clamp(.82rem,1.4vw,1rem);
  color:var(--muted);
  padding:clamp(14px,2vw,20px) clamp(16px,2.4vw,30px);
  white-space:nowrap;
  position:relative;
  transition:color .2s,background .2s;
  border-right:1px solid rgba(244,239,230,.07);
}
.tab .count{font-size:.66em;vertical-align:super;margin-left:.3em;opacity:.6}
.tab:hover{color:var(--paper)}
.tab.active{color:var(--ink)}
.tab.active::before{content:"";position:absolute;inset:0;z-index:-1}
.tab[data-slug="peintures"].active{background:var(--red);color:#fff}
.tab[data-slug="dessins"].active{background:var(--yellow);color:var(--ink)}
.tab[data-slug="sculptures"].active{background:var(--cyan);color:var(--ink)}
.tab[data-slug="photographies"].active{background:var(--green);color:var(--ink)}
.tab[data-slug="autres"].active{background:var(--magenta);color:#fff}

/* ---------- GRILLE ---------- */
main{padding:clamp(22px,4vw,46px) var(--edge) 12vh;background:var(--ink)}
.section-head{
  display:flex;align-items:baseline;gap:1rem;
  margin-bottom:clamp(20px,3vw,34px);
  flex-wrap:wrap;
}
.section-head h2{
  font-family:"Archivo Black",sans-serif;
  font-size:clamp(1.6rem,4vw,3rem);
  text-transform:uppercase;
  letter-spacing:-.01em;
  line-height:1;
}
.section-head .note{
  font-family:"Archivo Narrow",sans-serif;
  color:var(--muted);
  font-size:.95rem;
  letter-spacing:.02em;
}
.grid{columns:5 250px;column-gap:var(--gap)}
@media(max-width:640px){.grid{columns:2 150px}}
.cell{
  break-inside:avoid;
  margin-bottom:var(--gap);
  cursor:zoom-in;
  position:relative;
  background:var(--panel);
  overflow:hidden;
  opacity:0;transform:translateY(14px);
  transition:opacity .55s ease,transform .55s ease;
}
.cell.in{opacity:1;transform:none}
.cell img{display:block;width:100%;height:auto;
  transition:transform .55s cubic-bezier(.2,0,.1,1),filter .35s}
.cell::after{content:"";position:absolute;inset:0;
  box-shadow:inset 0 0 0 0 var(--yellow);transition:box-shadow .2s;pointer-events:none}
.cell:hover img{transform:scale(1.04)}
.cell:hover::after{box-shadow:inset 0 0 0 4px var(--yellow)}
.cell .meta{
  position:absolute;left:0;bottom:0;
  background:var(--yellow);color:var(--ink);
  font-family:"Archivo Narrow",sans-serif;font-weight:700;
  font-size:.8rem;padding:3px 10px;
  transform:translateY(100%);transition:transform .25s ease;
  font-variant-numeric:tabular-nums;
}
.cell:hover .meta{transform:none}
.series-badge{position:absolute;top:0;right:0;background:var(--cyan);color:var(--ink);
  font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  font-size:.64rem;padding:3px 8px;z-index:2}

/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:100;background:rgba(20,16,24,.97);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.lb.open{opacity:1;visibility:visible}
.lb-stage{max-width:90vw;max-height:80vh;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:90vw;max-height:80vh;width:auto;height:auto;object-fit:contain;
  box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.lb-stage img.ready{opacity:1}
.lb-caption{position:fixed;bottom:clamp(16px,4vh,38px);left:0;right:0;text-align:center;
  font-family:"Archivo Narrow",sans-serif;font-weight:600;letter-spacing:.04em;
  color:var(--paper);font-variant-numeric:tabular-nums}
.lb-caption .idx{color:var(--muted);margin-left:.7em}
/* bande des esquisses / variantes attachees a une oeuvre */
.lb-series{position:fixed;bottom:0;left:0;right:0;z-index:105;
  display:flex;gap:12px;justify-content:center;align-items:flex-end;
  padding:12px clamp(14px,3vw,30px) calc(clamp(16px,4vh,38px) + 22px);
  background:linear-gradient(to top,rgba(20,16,24,.9),transparent);
  flex-wrap:wrap;pointer-events:none}
.lb-series.show{pointer-events:auto}
.lb-series:empty{display:none}
.lb-series figure{margin:0;cursor:pointer;text-align:center;transition:transform .2s}
.lb-series figure:hover{transform:translateY(-4px)}
.lb-series img{height:clamp(58px,9vh,96px);width:auto;display:block;
  border:2px solid rgba(244,239,230,.25);border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.lb-series figure.active img{border-color:var(--yellow)}
.lb-series figcaption{font-family:"Archivo Narrow",sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;font-size:.62rem;color:var(--muted);margin-top:5px}
.lb-series figure.active figcaption{color:var(--yellow)}
/* quand des annexes sont presentes, on remonte la legende au-dessus de la bande */
.lb.has-series .lb-caption{bottom:calc(clamp(58px,9vh,96px) + 46px)}
.lb-btn{position:fixed;top:0;bottom:0;width:clamp(60px,12vw,150px);border:none;background:none;
  cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;
  transition:color .2s;z-index:101}
.lb-btn:hover{color:var(--yellow)}
.lb-btn svg{width:28px;height:28px}
.lb-prev{left:0;justify-content:flex-start;padding-left:clamp(14px,3vw,38px)}
.lb-next{right:0;justify-content:flex-end;padding-right:clamp(14px,3vw,38px)}
.lb-close{position:fixed;top:clamp(12px,3vh,26px);right:clamp(14px,3vw,30px);
  width:52px;height:52px;border:none;background:var(--red);cursor:pointer;color:#fff;z-index:110;
  display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;border-radius:50%}
.lb-close:hover{background:var(--vermillon);transform:rotate(90deg)}
.lb-close svg{width:22px;height:22px}
/* la zone du bouton suivant s'arrete avant la croix pour eviter le chevauchement */
.lb-next{top:90px}
@media(max-width:640px){.lb-btn{width:52px}.lb-stage,.lb-stage img{max-height:72vh}}

/* ---------- FOOTER ---------- */
footer{background:var(--panel);border-top:6px solid var(--red);
  padding:clamp(28px,5vw,54px) var(--edge);
  display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;align-items:center}
footer .fm{font-family:"Archivo Black",sans-serif;text-transform:uppercase;
  font-size:clamp(1rem,2vw,1.3rem);letter-spacing:-.01em}
footer .fs{font-family:"Archivo Narrow",sans-serif;color:var(--muted);font-size:.85rem;letter-spacing:.03em}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.cell{opacity:1;transform:none}}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
</head>
<body>

<section class="hero">

    <defs>

          M120,0 C186,0 240,54 240,120 C240,186 186,240 120,240 C54,240 0,186 0,120 C0,54 54,0 120,0 Z;

<nav><div class="nav-inner" id="tabs"></div></nav>

<main>
  <div class="section-head">
    <h2 id="secTitle"></h2>
    <span class="note" id="secNote"></span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <span class="fm">Pierre Guilbert</span>
  <span class="fs">© <span id="year"></span> · Vitrine réalisée par la famille</span>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Œuvre agrandie">
  <button class="lb-close" id="lbClose" aria-label="Fermer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Précédente">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="lb-stage"><img id="lbImg" alt=""></div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Suivante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-caption" id="lbCap"></div>
  <div class="lb-series" id="lbSeries"></div>
</div>

<script>
const ORDER=["peintures","dessins","sculptures","photographies","autres"];
const NOTES={
  peintures:"Huiles et acryliques · 1960–1999",
  dessins:"Crayon, feutre et études · 1944–1994",
  sculptures:"Pierre, plâtre et terre",
  photographies:"Tirages argentiques et couleur",
  autres:"Pièces diverses"
};
let DATA={},current=null,cur=[],curIdx=0;
document.getElementById("year").textContent=new Date().getFullYear();

fetch("manifest.json").then(r=>r.json()).then(m=>{
  DATA=m;
  const tabs=document.getElementById("tabs");
  ORDER.forEach((slug,i)=>{
    if(!DATA[slug]||!DATA[slug].items.length)return;
    const b=document.createElement("button");
    b.className="tab"; b.dataset.slug=slug;
    b.innerHTML=`${DATA[slug].label}<span class="count">${DATA[slug].items.length}</span>`;
    b.onclick=()=>select(slug);
    tabs.appendChild(b);
  });
  select(ORDER.find(s=>DATA[s]&&DATA[s].items.length));
});

const io=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}});
},{rootMargin:"140px"});

function select(slug){
  if(!slug||current===slug)return;
  current=slug;cur=DATA[slug].items;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.slug===slug));
  document.getElementById("secTitle").textContent=DATA[slug].label;
  document.getElementById("secNote").textContent=NOTES[slug]||"";
  const grid=document.getElementById("grid");grid.innerHTML="";
  cur.forEach((it,idx)=>{
    const cell=document.createElement("figure");cell.className="cell";
    cell.style.aspectRatio=`${it.w} / ${it.h}`;
    const img=document.createElement("img");
    img.loading="lazy";img.decoding="async";
    img.src=`images/thumbs/${it.id}.jpg`;
    img.alt=it.year?`Œuvre de ${it.year}`:"Œuvre";
    cell.appendChild(img);
    if(it.year){const meta=document.createElement("figcaption");meta.className="meta";meta.textContent=it.year;cell.appendChild(meta);}
    if(it.series){
      const n=(it.series.sketches?it.series.sketches.length:0)+(it.series.variants?it.series.variants.length:0);
      if(n>0){const badge=document.createElement("span");badge.className="series-badge";
        badge.textContent=n+(n>1?" études":" étude");cell.appendChild(badge);}
    }
    cell.onclick=()=>openLb(idx);
    grid.appendChild(cell);io.observe(cell);
  });
}

const lb=document.getElementById("lb"),lbImg=document.getElementById("lbImg"),lbCap=document.getElementById("lbCap");
const lbSeries=document.getElementById("lbSeries");
let seriesViews=[];      // les images visibles dans la serie courante
let seriesActive=0;
function openLb(i){curIdx=i;showLb();lb.classList.add("open");document.body.style.overflow="hidden"}
function closeLb(){lb.classList.remove("open");document.body.style.overflow=""}

function buildSeries(it){
  // construit la liste : oeuvre principale + esquisses + variantes
  seriesViews=[{id:it.id, role:"Œuvre", year:it.year}];
  if(it.series){
    (it.series.variants||[]).forEach(s=>seriesViews.push({id:s.id,role:"Variante",year:s.year}));
    (it.series.sketches||[]).forEach(s=>seriesViews.push({id:s.id,role:"Esquisse",year:s.year}));
  }
}
function renderSeriesBar(){
  lbSeries.innerHTML="";
  if(seriesViews.length<=1){lb.classList.remove("has-series");lbSeries.classList.remove("show");return;}
  lb.classList.add("has-series");lbSeries.classList.add("show");
  seriesViews.forEach((v,i)=>{
    const fig=document.createElement("figure");
    if(i===seriesActive)fig.className="active";
    fig.innerHTML=`<img src="images/thumbs/${v.id}.jpg" alt="${v.role}"><figcaption>${v.role}</figcaption>`;
    fig.onclick=(e)=>{e.stopPropagation();seriesActive=i;showSeriesImage();};
    lbSeries.appendChild(fig);
  });
}
function showSeriesImage(){
  const v=seriesViews[seriesActive];
  lbImg.classList.remove("ready");
  const pre=new Image();pre.onload=()=>{lbImg.src=pre.src;lbImg.classList.add("ready")};
  pre.src=`images/full/${v.id}.jpg`;
  lbImg.alt=v.year?`${v.role} — ${v.year}`:v.role;
  const label=DATA[current].label.replace(/s$/,"");
  const roleTxt=seriesViews.length>1?`${v.role}${v.year?" · "+v.year:""}`:(v.year||label);
  lbCap.innerHTML=`${roleTxt}<span class="idx">${curIdx+1} / ${cur.length}</span>`;
  lbSeries.querySelectorAll("figure").forEach((f,i)=>f.classList.toggle("active",i===seriesActive));
}
function showLb(){
  const it=cur[curIdx];
  buildSeries(it);
  seriesActive=0;
  renderSeriesBar();
  showSeriesImage();
}
function nav(d){curIdx=(curIdx+d+cur.length)%cur.length;showLb()}
document.getElementById("lbNext").onclick=()=>nav(1);
document.getElementById("lbPrev").onclick=()=>nav(-1);
document.getElementById("lbClose").onclick=closeLb;
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("lb-stage"))closeLb()};
document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")closeLb();else if(e.key==="ArrowRight")nav(1);else if(e.key==="ArrowLeft")nav(-1);
});
let tx=0;
lb.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
lb.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)nav(dx<0?1:-1)},{passive:true});

/* ---- parallaxe : les formes derivent au scroll ---- */
(function(){
  const svg=document.getElementById("heroSvg");
  if(!svg)return;
  const reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce)return;
  let ticking=false;
  function update(){
    const y=window.scrollY;
    // les formes montent plus vite que la page + leger zoom -> effet de profondeur
    svg.style.transform=`translate3d(${y*0.04}px, ${y*0.32}px, 0) scale(${1+y*0.00018})`;
    svg.style.opacity=Math.max(0,1-y/900);
    ticking=false;
  }
  window.addEventListener("scroll",()=>{
    if(!ticking){requestAnimationFrame(update);ticking=true;}
  },{passive:true});
  update();
})();
</script>
